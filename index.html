<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MAKOYX Tetris Battle</title>
<style>
*{box-sizing:border-box;margin:0}
body{min-height:100vh;font-family:'Trebuchet MS',Arial,sans-serif;background:radial-gradient(ellipse at 50% 30%,#3a3658 0,#211f33 55%,#12111d 100%);color:#fff;display:flex;flex-direction:column;align-items:center;padding:8px;user-select:none;touch-action:manipulation}
h1{font:italic 900 34px Arial;color:#ffe600;text-shadow:0 3px 0 #b45309,0 0 12px #0008;letter-spacing:2px;margin:2px 0 8px}
.hide{display:none!important}
.card{background:linear-gradient(#3a4052,#14171f);border:3px solid #aeb4c6;border-radius:14px;padding:16px;box-shadow:0 6px 0 #0007;width:100%;max-width:460px;margin-bottom:10px}
.card label{font-size:12px;color:#bfe8ff}
input{width:100%;padding:10px;border-radius:8px;border:2px solid #555b70;background:#0c0e14;color:#fff;font-size:16px;margin:6px 0}
button{cursor:pointer;border:0;border-radius:8px;padding:11px 14px;font:700 14px 'Trebuchet MS',Arial;background:#444b60;color:#fff;box-shadow:0 3px 0 #0008}
button:active{transform:translateY(2px);box-shadow:none}button:disabled{opacity:.4}
.go{background:linear-gradient(#ffe600,#f59e0b);color:#3a2200}
.row{display:flex;gap:8px;margin:8px 0}.row>*{flex:1}
.m.on{background:linear-gradient(#37d7ff,#0a84c7)}
#ls{min-height:18px;color:#ffd84a;font-size:13px;margin-top:8px}
.cols{display:flex;gap:10px}.col{flex:1;background:#0c0e14;border-radius:10px;padding:8px}.col h3{font-size:13px;text-align:center;margin-bottom:6px}
.slot{padding:8px;margin:4px 0;border-radius:6px;background:#1c2030;border:1px dashed #555b70;font-size:13px;text-align:center;color:#8a90a3}.slot.f{border-style:solid;color:#fff}
#top{display:flex;gap:8px;align-items:flex-start;width:100%;max-width:1000px;margin-bottom:6px}
#banner{display:flex;gap:8px;align-items:center;background:linear-gradient(#2a6bd1,#123a85);border:3px solid #dfe6f5;border-radius:12px;padding:5px 12px 5px 6px;flex:1;max-width:300px}
.av{width:38px;height:38px;border-radius:7px;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font:900 20px Arial;flex:none}
#banner b{font-size:16px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#banner small{font-size:11px;display:block}#stars{color:#ffd400;font-size:15px;letter-spacing:1px}
.tb{background:#fff;color:#555;border-radius:0 0 12px 12px;padding:2px 18px;text-align:center;font:italic 900 11px Arial;border:2px solid #c9cfdd;border-top:0}
.tb b{display:block;font-size:24px;color:#ffd400;background:#2b2b2b;border-radius:6px;padding:0 8px;text-shadow:0 0 6px #ffd40088}
#arena{display:flex;gap:14px;align-items:flex-start;justify-content:center;flex-wrap:wrap;width:100%;max-width:1000px}
#me{display:flex;gap:6px;align-items:flex-start;background:linear-gradient(#2c303d,#0b0d12);border:4px solid #8a90a3;border-radius:18px;padding:10px;position:relative}
#me.hit{animation:hit .4s}@keyframes hit{50%{box-shadow:0 0 25px 8px #ff3030}}
.side{display:flex;flex-direction:column;gap:6px;align-items:center;width:80px}
.lbl{font:italic 900 15px Arial;color:#9be3ff;text-shadow:0 2px 0 #000}
.side canvas{background:#0c0e14;border:3px solid #596075;border-radius:8px;width:76px;display:block}
.lk{width:60px;height:50px;border:3px solid #596075;border-radius:8px;background:#0c0e14;font:900 26px Arial;color:#3a3f50;display:flex;align-items:center;justify-content:center}
#gb{width:10px;height:calc(min(280px,50vw)*2);background:#0c0e14;border-radius:5px;display:flex;align-items:flex-end;overflow:hidden}
#gbf{width:100%;background:linear-gradient(#ff7b7b,#d00000);height:0;transition:height .15s}
#bw{width:min(280px,50vw);position:relative}#bw canvas{width:100%;display:block;border:3px solid #596075;border-radius:6px}
#st{font-size:11px;text-align:center;color:#9be3ff;display:flex;flex-direction:column;gap:2px}#st b{display:block;font-size:16px;color:#fff}
#logo{font:italic 900 20px Arial;color:#ffe600;text-shadow:0 2px 0 #b45309,0 0 4px #000;margin-top:4px}
#fx{position:absolute;left:0;right:0;top:35%;text-align:center;font:900 22px Arial;color:#ffe600;text-shadow:0 2px 0 #b45309,0 0 8px #000;pointer-events:none;opacity:0}
#fx.s{animation:pop 1.1s ease-out}@keyframes pop{0%{opacity:1;transform:scale(.6)}20%{transform:scale(1.15)}100%{opacity:0;transform:translateY(-40px)}}
#opps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;flex:1;min-width:300px;max-width:470px}
.opp{background:linear-gradient(#2c303d,#0b0d12);border:3px solid #ff5252;border-radius:12px;padding:4px;position:relative}
.opp.ally{border-color:#37d7ff}.opp canvas{width:100%;display:block;border-radius:4px}
.oh{display:flex;gap:4px;align-items:center;background:#555b6e;border-radius:8px 8px 0 0;padding:2px 4px;margin-bottom:3px;font:700 11px Arial}.oh .av{width:20px;height:20px;font-size:11px;border-width:1px}.oh span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.opp .sc{font-size:10px;text-align:center;color:#bfe8ff}
.opp.out::after{content:'OUT';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#000a;font:900 26px Arial;color:#ff5252;border-radius:9px}
.opp.tg::before{content:'';position:absolute;left:20%;right:20%;top:30%;aspect-ratio:1;border:5px solid #37d7ff;border-radius:50%;box-shadow:0 0 12px #37d7ff,inset 0 0 12px #37d7ff;z-index:3;animation:rt .7s}@keyframes rt{from{transform:scale(1.6);opacity:0}to{transform:scale(1);opacity:1}}
.dm{position:fixed;width:16px;height:16px;border:3px solid #37d7ff;background:#37d7ff44;transform:rotate(45deg);transition:left .5s ease-in,top .5s ease-in,opacity .5s;z-index:8;pointer-events:none}
#res{position:fixed;inset:0;background:#000b;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;z-index:9;text-align:center;padding:10px}
#res h2{font:900 clamp(34px,9vw,70px) Arial;color:#ffe600;text-shadow:0 4px 0 #b45309}
#tc{display:none;gap:6px;margin-top:8px;width:100%;max-width:440px}#tc button{flex:1;padding:16px 0;font-size:18px}
@media(pointer:coarse),(max-width:700px){#tc{display:flex}}
@media(max-width:700px){#arena{flex-direction:column;align-items:center}#opps{order:-1;grid-template-columns:repeat(5,1fr);min-width:0;width:100%}.oh span{display:none}.side{width:60px}.side canvas{width:56px}.lk{width:44px;height:34px;font-size:18px}}
#bgfx{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;background-image:linear-gradient(rgba(150,150,230,.16) 1px,transparent 1px),linear-gradient(90deg,rgba(150,150,230,.16) 1px,transparent 1px);background-size:44px 44px}
#bgfx::before{content:'';position:absolute;left:0;right:0;bottom:0;height:72px;background:linear-gradient(#3a1a55,#0b0a14)}
#bgfx::after{content:'';position:absolute;left:0;right:0;bottom:70px;height:4px;background:#ff5fe0;box-shadow:0 0 10px 2px #ff5fe0,0 0 40px 10px #ff2ea866}
#bgfx i{position:absolute;width:42px;height:42px;border-radius:7px;opacity:.45;box-shadow:inset 0 0 8px #fff7,0 0 6px #0006}
</style></head><body>
<h1>MAKOYX TETRIS</h1>

  <div id="me">

   <div id="gb"><div id="gbf"></div></div>

    <div id="st"><span>SCORE<b id="sc">0</b></span><span>LINES<b id="ln">0</b></span></div><div id="logo">MAKOYX</div></div>
  </div>

 <div id="tc"><button data-a="L">◀</button><button data-a="SD">▼</button><button data-a="R">▶</button><button data-a="CCW">↺</button><button data-a="CW">↻</button><button data-a="HOLD">H</button><button data-a="HD">⤓</button></div>
 <p style="font-size:12px;margin-top:8px;text-shadow:0 1px 0 #000">←→ move · ↓ soft · ↑/X rotate · Z counter · Space hard drop · C hold</p>
</div>

<div id="res" class="hide"><h2 id="rt"></h2><div id="rsub"></div><div class="row"><button class="go hide" id="again">Rematch</button><button id="back">Return to Lobby</button></div></div>

<script>

const firebaseConfig={
  apiKey:"AIzaSyCKFAwHTuPLP_eEmQy2ttFx7EzqVJkaA0k",
  authDomain:"alaw-tetris.firebaseapp.com",

};
const $=id=>document.getElementById(id),esc=s=>String(s||'').replace(/[<>&"]/g,c=>'&#'+c.charCodeAt(0)+';'),A=v=>Array.isArray(v)?v:Object.values(v||{});
const TS={'1v1':1,'2v2':2,'3v3':3,'4v4':4,'5v5':5};
let db;try{firebase.initializeApp(firebaseConfig);db=firebase.database()}catch(e){}
/* ---------- sound ---------- */
let AC;function snd(f,d=.08,t='square',v=.04){try{AC=AC||new AudioContext();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.stop(AC.currentTime+d)}catch(e){}}
/* ---------- core (SRS) ---------- */
const P={I:[4,[[0,1],[1,1],[2,1],[3,1]]],O:[4,[[1,0],[2,0],[1,1],[2,1]]],T:[3,[[1,0],[0,1],[1,1],[2,1]]],S:[3,[[1,0],[2,0],[0,1],[1,1]]],Z:[3,[[0,0],[1,0],[1,1],[2,1]]],J:[3,[[0,0],[0,1],[1,1],[2,1]]],L:[3,[[2,0],[0,1],[1,1],[2,1]]]};
const SH={};for(const t in P){const[n,c]=P[t];SH[t]=[c];for(let r=1;r<4;r++)SH[t][r]=SH[t][r-1].map(([x,y])=>[n-1-y,x])}
const KJ={'01':'0,0 -1,0 -1,1 0,-2 -1,-2','10':'0,0 1,0 1,-1 0,2 1,2','12':'0,0 1,0 1,-1 0,2 1,2','21':'0,0 -1,0 -1,1 0,-2 -1,-2','23':'0,0 1,0 1,1 0,-2 1,-2','32':'0,0 -1,0 -1,-1 0,2 -1,2','30':'0,0 -1,0 -1,-1 0,2 -1,2','03':'0,0 1,0 1,1 0,-2 1,-2'};
const KI={'01':'0,0 -2,0 1,0 -2,-1 1,2','10':'0,0 2,0 -1,0 2,1 -1,-2','12':'0,0 -1,0 2,0 -1,2 2,-1','21':'0,0 1,0 -2,0 1,-2 -2,1','23':'0,0 2,0 -1,0 2,1 -1,-2','32':'0,0 -2,0 1,0 -2,-1 1,2','30':'0,0 1,0 -2,0 1,-2 -2,1','03':'0,0 -1,0 2,0 -1,2 2,-1'};
const CB=[0,0,1,1,2,2,3,3,4,4,4,5];
class Game{
 constructor(){this.b=Array.from({length:20},()=>Array(10).fill(''));this.q=[];this.hold='';this.can=1;this.sc=0;this.ln=0;this.cb=-1;this.b2=0;this.inc=0;this.dead=0;this.m='';this.spawn()}
 get lv(){return this.ln/10|0}
 g(){return Math.max(60,800*Math.pow(.85,this.lv))}
 bag(){while(this.q.length<7){const a=[...'IOTSZJL'];for(let i=6;i;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}this.q.push(...a)}}
 spawn(t){this.bag();t=t||this.q.shift();this.bag();this.p={t,r:0,x:3,y:0};this.tsp=0;this.gt=0;this.rs=0;this.acc=0;if(this.hit(t,0,3,0))this.dead=1}
 hit(t,r,x,y){return SH[t][r].some(([a,c])=>{const X=x+a,Y=y+c;return X<0||X>9||Y>19||(Y>=0&&this.b[Y][X])})}
 reset(){if(this.rs++<15)this.gt=0}
 go(d){const p=this.p;if(!this.hit(p.t,p.r,p.x+d,p.y)){p.x+=d;this.tsp=0;this.reset();snd(200,.03)}}
 rot(d){const p=this.p;if(p.t==='O')return;const to=(p.r+d+4)%4;for(const k of(p.t==='I'?KI:KJ)[''+p.r+to].split(' ')){const[kx,ky]=k.split(',').map(Number);if(!this.hit(p.t,to,p.x+kx,p.y-ky)){p.r=to;p.x+=kx;p.y-=ky;this.tsp=1;this.reset();snd(330,.04);return}}}
 down(){const p=this.p;if(!this.hit(p.t,p.r,p.x,p.y+1)){p.y++;this.tsp=0;return 1}}
 gy(){const p=this.p;let y=p.y;while(!this.hit(p.t,p.r,p.x,y+1))y++;return y}
 hard(){const y=this.gy();this.sc+=(y-this.p.y)*2;this.p.y=y;return this.lock()}
 holdP(){if(!this.can)return;const h=this.hold;this.hold=this.p.t;this.spawn(h||undefined);this.can=0;snd(260,.05)}
 update(dt,soft){const g=soft?Math.min(40,this.g()):this.g(),p=this.p;this.acc+=dt;
  while(this.acc>=g){this.acc-=g;if(this.down()){if(soft)this.sc++}else{this.acc=0;break}}
  if(this.hit(p.t,p.r,p.x,p.y+1)){this.gt+=dt;if(this.gt>500)return this.lock()}else this.gt=0;return null}
 lock(){const{t,r,x,y}=this.p;let ts=0;
  if(t==='T'&&this.tsp){let c=0;for(const[dx,dy]of[[0,0],[2,0],[0,2],[2,2]]){const X=x+dx,Y=y+dy;if(X<0||X>9||Y>19||(Y>=0&&this.b[Y][X]))c++}ts=c>=3}
  for(const[a,c]of SH[t][r])if(y+c>=0)this.b[y+c][x+a]=t;
  const keep=this.b.filter(w=>w.some(c=>!c)),n=20-keep.length;while(keep.length<20)keep.unshift(Array(10).fill(''));this.b=keep;
  let atk=0,m='';snd(140,.06);
  if(n){this.cb++;const hard=n===4||ts;atk=ts?[0,2,4,6][n]:[0,0,1,2,4][n];
   if(hard&&this.b2){atk++;m='B2B '}this.b2=hard?1:0;atk+=CB[Math.min(this.cb,11)];
   m+=(ts?'T-SPIN ':'')+['','SINGLE','DOUBLE','TRIPLE','TETRIS'][n]+(this.cb>0?' x'+this.cb:'');
   this.sc+=((ts?[0,800,1200,1600]:[0,100,300,500,800])[n]*(this.lv+1)*(this.b2&&hard?1.5:1)|0)+50*this.cb;this.ln+=n;
   if(this.b.every(w=>w.every(c=>!c))){atk+=10;m='PERFECT CLEAR!';this.sc+=2000}
   snd(440+n*110,.2,'triangle',.07)
  }else{this.cb=-1;if(ts){m='T-SPIN';this.sc+=400}}
  if(atk>0&&this.inc>0){const c=Math.min(this.inc,atk);this.inc-=c;atk-=c}
  if(!n&&this.inc>0){const k=Math.min(this.inc,8),h=Math.random()*10|0;this.inc-=k;snd(90,.25,'sawtooth',.08);
   for(let i=0;i<k;i++){if(this.b[0].some(c=>c))this.dead=1;this.b.shift();const w=Array(10).fill('G');w[h]='';this.b.push(w)}}
  this.m=m;this.can=1;this.spawn();return atk}
}
/* ---------- render ---------- */
const COL={I:'#22d3ee',O:'#facc15',T:'#a855f7',S:'#22c55e',Z:'#ef4444',J:'#3b82f6',L:'#f97316',G:'#7c8190'};
function cell(c,t,x,y,s,a){c.globalAlpha=a||1;c.fillStyle=COL[t]||t;c.fillRect(x,y,s,s);c.fillStyle='rgba(255,255,255,.4)';c.fillRect(x,y,s,s*.18);c.fillRect(x,y,s*.18,s);c.fillStyle='rgba(0,0,0,.3)';c.fillRect(x,y+s*.82,s,s*.18);c.fillRect(x+s*.82,y,s*.18,s);c.globalAlpha=1}
function paint(c,rows,s,pc,gy){c.fillStyle='#14171f';c.fillRect(0,0,s*10,s*20);c.strokeStyle='rgba(255,255,255,.05)';c.beginPath();
 for(let i=1;i<10;i++){c.moveTo(i*s,0);c.lineTo(i*s,s*20)}for(let i=1;i<20;i++){c.moveTo(0,i*s);c.lineTo(s*10,i*s)}c.stroke();
 for(let y=0;y<20;y++)for(let x=0;x<10;x++){const k=rows[y]&&rows[y][x];if(k)cell(c,k,x*s,y*s,s)}
 if(pc){if(gy!=null&&gy!==pc.y)for(const[a,b]of pc.cells)cell(c,pc.col,(pc.x+a)*s,(gy+b)*s,s,.25);
  for(const[a,b]of pc.cells)if(pc.y+b>=0)cell(c,pc.col,(pc.x+a)*s,(pc.y+b)*s,s)}}
const pcOf=p=>({cells:SH[p.t][p.r],col:COL[p.t],x:p.x,y:p.y});
function prev(c,t,cx,cy,s){if(!t)return;const n=P[t][0];for(const[a,b]of SH[t][0])cell(c,t,cx+(a-n/2)*s,cy+(b-n/2)*s,s)}
const mat=(t,r)=>{const n=P[t][0],m=Array.from({length:n},()=>Array(n).fill(0));SH[t][r].forEach(([x,y])=>m[y][x]=1);return m};
/* ---------- local profile (device only) ---------- */
let prof={name:'',xp:0,w:0,l:0};try{prof=Object.assign(prof,JSON.parse(localStorage.getItem('mkx_prof')||'{}'))}catch(e){}
const saveProf=()=>{try{localStorage.setItem('mkx_prof',JSON.stringify(prof))}catch(e){}};
const avatar=(el,n)=>{let h=0;for(const ch of String(n))h=(h*31+ch.charCodeAt(0))%360;el.style.background=`hsl(${h},65%,42%)`;el.textContent=(String(n)[0]||'?').toUpperCase()};
const level=()=>1+(prof.xp/150|0),RN=['ROOKIE','AMATEUR','PRO','ELITE','LEGEND'];
/* ---------- network: existing tetrisRooms schema only ---------- */
const myId='p_'+Math.random().toString(36).slice(2,9);
let sel='1v1',roomId,mode='1v1',teamSize=1,myTeam,mySlot,myName='Player',hostId,roomRef,pH,sH,hH,G1,running=0,started=0,ended=0,raf,lastSync=0,players={},panels={},ready=0,last,t0,soft=0,gH;const H={dir:0,t:0};
const ls=t=>$('ls').textContent=t;
$('modes').innerHTML=Object.keys(TS).map(m=>`<button class="m${m===sel?' on':''}" data-m="${m}">${m}</button>`).join('');
$('modes').onclick=e=>{const m=e.target.dataset.m;if(!m)return;sel=m;document.querySelectorAll('.m').forEach(b=>b.classList.toggle('on',b.dataset.m===m))};
$('nm').value=prof.name||'';
const getName=()=>{myName=($('nm').value||'Player').trim().slice(0,16)||'Player';prof.name=myName;saveProf();return myName};
const need=()=>{if(!db){ls('Firebase failed to load.');return 0}return 1};
$('cr').onclick=()=>{if(!need())return;getName();mode=sel;teamSize=TS[mode];roomId=Math.random().toString(36).slice(2,7).toUpperCase();myTeam='A';mySlot=1;hostId=myId;roomRef=db.ref('tetrisRooms/'+roomId);
 roomRef.set({createdAt:Date.now(),status:'waiting',mode,teamSize,hostId:myId,teamCounts:{A:1,B:0},players:{[myId]:{name:myName,team:'A',slot:1,joined:true}}}).then(()=>{roomRef.child('players/'+myId).onDisconnect().remove();enterWait()}).catch(e=>ls('Error: '+e.message))};
$('jn').onclick=()=>{if(!need())return;const code=($('jc').value||'').trim().toUpperCase();if(!code){ls('Enter a room code.');return}getName();const ref=db.ref('tetrisRooms/'+code);
 ref.get().then(s=>{if(!s.exists()){ls('Room not found.');return}const d=s.val();if(d.status!=='waiting'){ls('That match already started.');return}
  roomId=code;roomRef=ref;mode=d.mode||'1v1';teamSize=d.teamSize||TS[mode];hostId=d.hostId;ls('');teamChoice(d)})};
function teamChoice(d){const c=d.teamCounts||{A:0,B:0},b=$('tch');b.classList.remove('hide');
 b.innerHTML=`<div style="margin-top:10px;font-size:12px">Room ${esc(roomId)} — ${esc(mode)} — choose a team</div><div class="row"><button id="pa" ${c.A>=teamSize?'disabled':''}>Team A (${c.A}/${teamSize})</button><button id="pb" ${c.B>=teamSize?'disabled':''}>Team B (${c.B}/${teamSize})</button></div>`;
 $('pa').onclick=()=>joinTeam('A');$('pb').onclick=()=>joinTeam('B')}
function joinTeam(t){roomRef.child('teamCounts/'+t).transaction(c=>{c=c||0;if(c>=teamSize)return;return c+1}).then(r=>{
 if(!r.committed){ls('That team just filled up — try the other one.');return}
 myTeam=t;mySlot=r.snapshot.val();roomRef.child('players/'+myId).set({name:myName,team:t,slot:mySlot,joined:true}).then(()=>{roomRef.child('players/'+myId).onDisconnect().remove();enterWait()})})}
function show(s){['lobby','wait','game'].forEach(k=>$(k).classList.toggle('hide',k!==s));$('game').style.display=s==='game'?'flex':'none'}
function enterWait(){show('wait');$('tch').classList.add('hide');$('wc').textContent=roomId;$('wm').textContent=mode.toUpperCase();listen()}
function listen(){
 pH=s=>{players=s.val()||{};if(!started)roster();else{drawOpps();board2();checkEnd()}};roomRef.child('players').on('value',pH);
 hH=s=>{hostId=s.val();if(!started)roster()};roomRef.child('hostId').on('value',hH);
 sH=s=>{if(s.val()==='starting'&&!running)startMatch()};roomRef.child('status').on('value',sH);
 gH=s=>{const n=s.val();if(n>0&&G1&&running){G1.inc+=n;roomRef.child('players/'+myId+'/incomingGarbage').set(0);$('me').classList.remove('hit');void $('me').offsetWidth;$('me').classList.add('hit');snd(80,.2,'sawtooth',.08)}};roomRef.child('players/'+myId+'/incomingGarbage').on('value',gH)}
function roster(){const a=[],b=[];Object.values(players).forEach(p=>(p.team==='A'?a:b).push(p));a.sort((x,y)=>x.slot-y.slot);b.sort((x,y)=>x.slot-y.slot);
 const H2=(l)=>{let o='';for(let i=1;i<=teamSize;i++){const p=l.find(x=>x.slot===i);o+=`<div class="slot ${p?'f':''}">${p?esc(p.name):'Open'}</div>`}return o};
 $('ra').innerHTML=H2(a);$('rb').innerHTML=H2(b);const h=hostId===myId,ok=a.length&&b.length;$('start').classList.toggle('hide',!h);$('start').disabled=!ok;
 $('ws').textContent=h?(ok?'Ready — start whenever you like.':'Waiting for at least 1 player on each team…'):'Waiting for the host to start…'}
$('start').onclick=()=>{if(hostId===myId&&roomRef)roomRef.child('status').set('starting')};
$('cp').onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(roomId);$('cp').textContent='Copied!';setTimeout(()=>$('cp').textContent='Copy',1200)};
function cleanup(){running=0;started=0;ended=0;cancelAnimationFrame(raf);
 if(roomRef){roomRef.child('players').off('value',pH);roomRef.child('status').off('value',sH);roomRef.child('hostId').off('value',hH);roomRef.child('players/'+myId+'/incomingGarbage').off('value',gH);
  if(hostId===myId)roomRef.child('players').get().then(s=>{const p=s.val()||{};delete p[myId];const r=Object.keys(p);if(r.length)roomRef.child('hostId').set(r[0])});
  roomRef.child('players/'+myId).onDisconnect().cancel();roomRef.child('players/'+myId).remove();if(myTeam)roomRef.child('teamCounts/'+myTeam).transaction(c=>Math.max((c||1)-1,0))}
 roomRef=roomId=myTeam=mySlot=hostId=null;G1=null;players={};panels={};$('res').classList.add('hide');show('lobby');ls('')}
$('wl').onclick=$('lv0').onclick=$('back').onclick=cleanup;
/* ---------- match ---------- */
function startMatch(){started=1;ended=0;running=0;ready=0;G1=new Game();show('game');$('res').classList.add('hide');
 $('mn').textContent=myName;avatar($('mav'),myName);const lv=level(),st=Math.min(5,Math.ceil(lv/2));$('mr').textContent=`RANK ${lv} (${RN[st-1]})`;$('stars').textContent='★'.repeat(st)+'☆'.repeat(5-st);$('rc').textContent=roomId;
 roomRef.child('players').get().then(s=>{players=s.val()||{};if(players[myId]){myTeam=players[myId].team;mySlot=players[myId].slot}buildOpps();ready=1});
 let n=3;fx(n);const iv=setInterval(()=>{n--;if(n>0)fx(n);else{clearInterval(iv);fx('GO!');snd(660,.2);running=1;t0=last=performance.now();push(1);raf=requestAnimationFrame(loop)}},700)}
function fx(t){const f=$('fx');f.textContent=t;f.className='';void f.offsetWidth;f.className='s'}
function buildOpps(){panels={};const o=Object.entries(players).filter(([i])=>i!==myId).sort((a,b)=>(a[1].team===myTeam?0:1)-(b[1].team===myTeam?0:1)||(a[1].slot||0)-(b[1].slot||0));
 $('opps').innerHTML=o.map(([i,p])=>`<div class="opp ${p.team===myTeam?'ally':''}" id="o_${i}"><div class="oh"><div class="av"></div><span>${esc(p.name)}</span></div><canvas width="100" height="200"></canvas><div class="sc">0</div></div>`).join('');
 o.forEach(([i,p])=>{const e=$('o_'+i);avatar(e.querySelector('.av'),p.name);panels[i]=e.querySelector('canvas').getContext('2d')})}
function drawOpps(){for(const i in panels){const d=players[i];if(!d)continue;const rows=d.board?A(d.board).map(r=>String(r).split(',').map(c=>c==='0'?'':c)):[];
 let pc=null;if(d.cur&&d.cur.m){const cells=[];A(d.cur.m).forEach((row,y)=>A(row).forEach((v,x)=>{if(v)cells.push([x,y])}));pc={cells,col:d.cur.color,x:d.cur.x,y:d.cur.y}}
 paint(panels[i],rows,10,pc);const o=$('o_'+i);o.querySelector('.sc').textContent=d.score||0;o.classList.toggle('out',!!d.gameOver)}}
function board2(){}
function checkEnd(){if(ended||!running||!ready)return;let aA=0,aB=0;Object.values(players).forEach(p=>{if(!p.gameOver)p.team==='A'?aA++:aB++});if(G1&&G1.dead){/* own flag may lag */}
 const aD=aA===0,bD=aB===0;if(!aD&&!bD)return;ended=1;running=0;cancelAnimationFrame(raf);roomRef.child('status').set('ended');
 const myDown=myTeam==='A'?aD:bD,win=!myDown&&!(aD&&bD),team=teamSize>1;
 $('rt').textContent=win?'YOU WIN!':(team?'HAHA VOVO TEAM! 🤣':'HAHA VOVO! 🤣');
 const xp=(win?60:20)+(G1?G1.ln*2:0);prof.xp+=xp;win?prof.w++:prof.l++;saveProf();$('rsub').textContent=`+${xp} XP · Lv ${level()} · ${prof.w}W/${prof.l}L (this device)`;
 snd(win?880:120,.5,win?'triangle':'sawtooth',.08);$('again').classList.toggle('hide',hostId!==myId);if(hostId!==myId)$('rsub').textContent+=' — waiting for host to rematch';$('res').classList.remove('hide')}
$('again').onclick=()=>{$('again').classList.add('hide');if(hostId!==myId||!roomRef)return;roomRef.child('players').get().then(s=>{const p=s.val()||{},u={};Object.keys(p).forEach(i=>{u['players/'+i+'/gameOver']=false;u['players/'+i+'/score']=0;u['players/'+i+'/lines']=0;u['players/'+i+'/incomingGarbage']=0});u.status='starting';roomRef.update(u)})};
function push(f){const n=performance.now();if(!roomRef||!G1||(!f&&n-lastSync<80))return;lastSync=n;const g=G1,p=g.p;
 roomRef.child('players/'+myId).update({board:g.b.map(w=>w.map(c=>c?(COL[c]||c):'0').join(',')),cur:{m:mat(p.t,p.r),color:COL[p.t],x:p.x,y:p.y},score:g.sc,lines:g.ln,gameOver:!!g.dead,name:myName,team:myTeam,slot:mySlot})}
function done(a){const g=G1;if(g.m)fx(g.m);if(a>0)send(a);push(1);if(g.dead){fx('K.O.');snd(100,.5,'sawtooth',.08)}}
function send(n){const o=Object.entries(players).filter(([i,p])=>p.team!==myTeam&&!p.gameOver);if(!o.length)return;const id=o[Math.random()*o.length|0][0];
 roomRef.child('players/'+id+'/incomingGarbage').transaction(c=>(c||0)+n);atk(id,n)}
function atk(id,n){const a=$('bw').getBoundingClientRect(),o=$('o_'+id),b=(o||$('bw')).getBoundingClientRect();
 for(let i=0;i<4;i++){const d=document.createElement('div');d.className='dm';d.style.left=a.right+'px';d.style.top=a.top+a.height/3+'px';document.body.appendChild(d);
  setTimeout(()=>{d.style.left=b.left+b.width/2+'px';d.style.top=b.top+b.height/2+'px';d.style.opacity=.2},30+i*70);setTimeout(()=>d.remove(),700+i*70)}
 if(o){o.classList.add('tg');setTimeout(()=>o.classList.remove('tg'),700)}}
const bc=$('bc').getContext('2d'),hc=$('hc').getContext('2d'),nc=$('nc').getContext('2d');
function loop(now){if(!running)return;raf=requestAnimationFrame(loop);const g=G1,dt=Math.min(now-last,50);last=now;
 if(!g.dead){if(H.dir&&now>=H.t){g.go(H.dir);H.t=now+40}const a=g.update(dt,soft);if(a!=null)done(a)}
 paint(bc,g.b,28,g.dead?null:pcOf(g.p),g.dead?null:g.gy());
 hc.fillStyle='#0c0e14';hc.fillRect(0,0,76,60);prev(hc,g.hold,38,30,14);
 nc.fillStyle='#0c0e14';nc.fillRect(0,0,76,310);g.q.slice(0,5).forEach((t,i)=>prev(nc,t,38,36+i*60,14));
 $('sc').textContent=g.sc;$('ln').textContent=g.ln;$('gbf').style.height=Math.min(g.inc,20)*5+'%';
 const s=(now-t0)/1000|0;$('tm').textContent=String(s/60|0).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
 push(0);if(g.dead)checkEnd()}
/* ---------- input ---------- */
function press(a,on){if(!running||!G1)return;const g=G1;
 if(!on){if(a==='SD')soft=0;if((a==='L'&&H.dir<0)||(a==='R'&&H.dir>0))H.dir=0;return}
 if(g.dead)return;
 if(a==='L'||a==='R'){const d=a==='L'?-1:1;g.go(d);H.dir=d;H.t=performance.now()+150}
 else if(a==='CW')g.rot(1);else if(a==='CCW')g.rot(-1);else if(a==='HD')done(g.hard());else if(a==='HOLD')g.holdP();else if(a==='SD')soft=1}
const KM={ArrowLeft:'L',ArrowRight:'R',ArrowUp:'CW',KeyX:'CW',KeyZ:'CCW',Space:'HD',ArrowDown:'SD',KeyC:'HOLD',ShiftLeft:'HOLD'};
addEventListener('keydown',e=>{const a=KM[e.code];if(a&&running){e.preventDefault();if(!e.repeat)press(a,1)}});
addEventListener('keyup',e=>{const a=KM[e.code];if(a)press(a,0)});
$('tc').addEventListener('pointerdown',e=>{const a=e.target.dataset.a;if(a){e.preventDefault();press(a,1)}});
['pointerup','pointercancel','pointerleave'].forEach(v=>$('tc').addEventListener(v,e=>{const a=e.target.dataset&&e.target.dataset.a;if(a)press(a,0)}));
(()=>{const b=document.createElement('div');b.id='bgfx';const S=44,C=['#ef4444','#3b82f6','#facc15','#22c55e','#a78bfa','#f97316','#22d3ee','#f472b6'];
for(let x=0;x<Math.ceil(screen.width/S)+1;x++){const h=1+(Math.random()*3|0);for(let y=0;y<h;y++){const c=document.createElement('i');c.style.cssText=`left:${x*S}px;bottom:${74+y*S}px;background:radial-gradient(circle at 30% 25%,#fff9 0,#fff0 40%),${C[Math.random()*8|0]}`;b.appendChild(c)}}document.body.prepend(b)})();
</script></body></html>
